services:
  ai-radar:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/radar.db
      RADAR_BRIEFS_DIR: /app/data/briefs
      RADAR_UI_BASE_URL: http://localhost:8080
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
