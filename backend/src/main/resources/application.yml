spring:
  application:
    name: ai-radar
  datasource:
    # WAL + busy_timeout: concurrent readers + wait instead of immediate SQLITE_BUSY
    url: jdbc:sqlite:file:./data/radar.db?journal_mode=WAL&busy_timeout=30000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Small pool: SQLite still serializes writers; WAL helps readers coexist
      maximum-pool-size: 4
      connection-init-sql: "PRAGMA busy_timeout=30000"
  jpa:
    hibernate:
      # Flyway owns schema; SQLite type affinity fights Hibernate validate (INTEGER vs BIGINT).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: 8080

radar:
  score-threshold: 60
  max-items: 30
  lookback-hours: 48
  dedup-lookback-days: 14
  interest-profile: 开源模型、Agent、推理基建、LLM 应用、AI 基础设施
  summary-language: zh
  briefs-dir: ./data/briefs
  max-snippet-chars: 2000
  ai-batch-size: 3
  ai-parallelism: ${AI_PARALLELISM:1}
  # After an LLM failure, skip live calls for this long (0 = always retry the model)
  ai-failure-cooldown-ms: ${AI_FAILURE_COOLDOWN_MS:60000}
  fetch-parallelism: 8
  fetch-interval-ms: 7200000
  fetch-initial-delay-ms: ${RADAR_FETCH_INITIAL_DELAY_MS:60000}
  cluster-interval-ms: 3600000
  cluster-initial-delay-ms: 120000
  fetch-timeout-ms: ${FETCH_TIMEOUT_MS:60000}
  push-cron: "0 0 8 * * *"
  timezone: Asia/Shanghai
  ui-base-url: http://localhost:8080
  push-only-when-items: true
  local-token: ${LOCAL_TOKEN:}
  # Argos Translate sidecar for en→zh titleDisplay (not LLM)
  translate:
    enabled: ${RADAR_TRANSLATE_ENABLED:true}
    base-url: ${RADAR_TRANSLATE_URL:http://127.0.0.1:8765}
    from: en
    to: zh
    connect-timeout-ms: 2000
    read-timeout-ms: 15000
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
    model: ${OPENAI_MODEL:qwen3.5:2b-mlx}
    context-window-tokens: ${OPENAI_CONTEXT_WINDOW_TOKENS:8192}
    max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:1024}
    keep-alive: ${OPENAI_KEEP_ALIVE:0}
    max-retries: ${OPENAI_MAX_RETRIES:2}
    retry-backoff-ms: ${OPENAI_RETRY_BACKOFF_MS:500}
  github:
    token: ${GITHUB_TOKEN:}
  producthunt:
    token: ${PH_TOKEN:}
  twitter:
    apify-token: ${APIFY_TOKEN:}
    actor-id: ${APIFY_TWITTER_ACTOR:altimis~scweet}
  email:
    enabled: ${EMAIL_INGEST_ENABLED:false}
    host: ${IMAP_HOST:}
    port: ${IMAP_PORT:993}
    username: ${IMAP_USERNAME:}
    password: ${IMAP_PASSWORD:}
    protocol: ${IMAP_PROTOCOL:imaps}
    folder: ${IMAP_FOLDER:INBOX}
    max-messages: ${IMAP_MAX_MESSAGES:20}
  web-fetch:
    enabled: ${WEB_FETCH_ENABLED:false}
    timeout-ms: 15000
    max-chars: 12000
    parallelism: ${WEB_FETCH_PARALLELISM:4}
  rsshub-base: ${RSSHUB_BASE:https://rsshub.umzzz.com}
  # Delivery: customer UI = smtpTo + Feishu scan-bind; transport/webhooks = env only.
  delivery:
    # Legacy custom-bot webhook (optional). Prefer Settings → Feishu scan-to-bind.
    feishu-webhook-url: ${FEISHU_WEBHOOK_URL:}
    # OpenAPI base for IM push after bind (override only for mocks / Lark intl).
    feishu-api-base: ${FEISHU_API_BASE:https://open.feishu.cn}
    # Generic JSON webhook for custom integrations (not shown in customer UI).
    webhook-url: ${WEBHOOK_URL:}
    webhook-headers: ${WEBHOOK_HEADERS:}
    # Always-on local file sink under ./data/outbox/ (useful without Feishu/SMTP).
    outbox-enabled: true
    smtp:
      # Deployer-only transport. Customer only sets recipient (smtpTo) in Settings UI.
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
      # Seed only; once the customer saves an inbox address, DB wins.
      to: ${SMTP_TO:}
      starttls: ${SMTP_STARTTLS:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.airadar: INFO
