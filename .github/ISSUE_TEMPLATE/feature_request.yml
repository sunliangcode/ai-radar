name: Feature Request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Contributions welcome across connectors, delivery, UI, MCP, packs, and docs.
        See [CONTRIBUTING.md](https://github.com/sunliangcode/ai-radar/blob/main/CONTRIBUTING.md)
        and [docs/extensibility.md](https://github.com/sunliangcode/ai-radar/blob/main/docs/extensibility.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does this fit? Helps route reviews.
      options:
        - Connector / source pack
        - Delivery channel
        - Pipeline / scoring / events
        - Web UI
        - Ops CLI
        - MCP / agents
        - Docs / install / Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? For SPI work, link extending-connectors.md / extending-delivery.md if relevant.
    validations:
      required: true

  - type: dropdown
    id: pr
    attributes:
      label: Would you be willing to submit a PR?
      options:
        - "Yes"
        - "No"
        - "Maybe"
    validations:
      required: true
