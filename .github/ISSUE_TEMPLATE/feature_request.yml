name: Feature Request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Contributions welcome across connectors, delivery, UI, MCP, packs, and docs. See `CONTRIBUTING.md`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: pr
    attributes:
      label: Would you be willing to submit a PR?
      options:
        - "Yes"
        - "No"
        - "Maybe"
    validations:
      required: true
