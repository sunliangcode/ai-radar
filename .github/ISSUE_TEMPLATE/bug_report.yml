name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start backend with `./mvnw spring-boot:run`
        2. POST /api/jobs/fetch
        3. See unexpected error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or git SHA"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 / Ubuntu 22.04"
    validations:
      required: true

  - type: dropdown
    id: run_mode
    attributes:
      label: How are you running ai-radar?
      options:
        - Dev (backend + frontend)
        - Single process (static in Spring)
        - Docker Compose
        - install.sh
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Do not paste secrets** — cookies, `LOCAL_TOKEN`, API keys, SMTP passwords, Feishu/webhook URLs, or `.env` contents.
        What stays local vs may leave the host: [PRIVACY.md](https://github.com/sunliangcode/ai-radar/blob/main/PRIVACY.md).

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (recommended)
      description: Paste doctor/health/status output with secrets redacted. Prefer doctor (cliVersion, versionAlign, llm, modelPresent, SPI connectors/deliveryChannels, backend version when up).
      placeholder: |
        ./bin/ai-radar doctor   # look for versionAlign / llm / SPI catalog warns
        # or
        ./scripts/status.sh     # also soft-checks connector/delivery catalogs
        ./bin/ai-radar health   # includes API version + llm.mode
        ./bin/ai-radar health-llm   # or MCP probe_llm (check modelPresent / hint)
        ./bin/ai-radar connectors | jq 'length'   # SPI catalog size
        ./bin/ai-radar delivery-channels | jq 'length'
        make check             # if you suspect a build/regression
        # Slow CLI/MCP? AI_RADAR_TIMEOUT_MS=30000 or 0  (request_timeout)
        # Backup prune: BACKUP_KEEP=14 (invalid → 14)
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Paste truncated logs; redact cookies, tokens, webhooks, and .env values (see PRIVACY.md)
      render: text
