name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start backend with `./mvnw spring-boot:run`
        2. POST /api/jobs/fetch
        3. See unexpected error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or git SHA"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 / Ubuntu 22.04"
    validations:
      required: true

  - type: dropdown
    id: run_mode
    attributes:
      label: How are you running ai-radar?
      options:
        - Dev (backend + frontend)
        - Single process (static in Spring)
        - Docker Compose
        - install.sh
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Paste truncated logs; redact secrets
      render: text
